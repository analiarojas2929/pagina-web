<div style="background:#eef4fa;padding:24px;font-family:Arial,sans-serif;color:#253249;">
  <div style="max-width:600px;margin:auto;background:#fff;border-radius:12px;overflow:hidden;">
    <div style="background:#101c30;color:#fff;padding:24px;">
      <h1 style="margin:0;font-size:22px;">A&amp;D DIGITAL</h1>
      <p style="margin:8px 0 0;color:#82e1e8;">Nueva solicitud de cotización</p>
    </div>
    <div style="padding:24px;">
      <p><strong>Solicitante:</strong> {{from_name}}</p>
      <p><strong>Correo de contacto:</strong> {{reply_to}}</p>
      <h2 style="font-size:18px;">{{subject}}</h2>
      <div style="white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere;">{{message}}</div>
    </div>
  </div>
</div>
